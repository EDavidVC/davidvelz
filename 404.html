<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Página no encontrada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Manrope', system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; background: #f4f1ea; color: #1e2a24; padding: 1.5rem; }
    .card { max-width: 560px; width: 100%; background: #fffdf8; border: 1px solid rgba(30,42,36,0.1); border-radius: 24px; padding: 2.5rem; text-align: center; box-shadow: 0 24px 60px rgba(36,68,58,0.08); }
    .code { font-size: 0.8rem; font-weight: 800; letter-spacing: 0.18em; color: #6b8f71; margin-bottom: 0.75rem; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.05; letter-spacing: -0.03em; margin-bottom: 0.75rem; }
    p { color: #5d6b63; margin-bottom: 1.5rem; }
    a { display: inline-flex; padding: 0.9rem 1.3rem; border-radius: 999px; background: #24443a; color: #f7f4ee; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main class="card">
    <p class="code">ERROR 404</p>
    <h1>Página no encontrada</h1>
    <p>La ruta que buscas no existe o fue movida. Puedes volver a la página principal.</p>
    <a href="/davidvelz/">Ir al inicio</a>
  </main>
</body>
</html>
